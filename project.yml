name: PetAgent
options:
  bundleIdPrefix: com.speaki-e
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  PetAgent:
    type: application
    platform: macOS
    sources:
      - path: PetAgent
        excludes:
          - Resources/Info.plist
          - Resources/PetAgent.entitlements
          - Resources/Avatars
          - Resources/Toys
      # Folder reference, not a group: the avatar package must keep its
      # Avatars/<name>/{manifest.json,*.usdz,sounds/} layout inside the app
      # bundle. As a group, Xcode flattens every file into Resources/ and
      # AvatarInstaller has nothing structured to copy out.
      - path: PetAgent/Resources/Avatars
        type: folder
        buildPhase: resources
      # Folder reference for the same reason as Avatars: each toy keeps its
      # own directory in the bundle, so ToyCatalogue can look artwork up by
      # toy name instead of relying on every file having a unique flat name.
      - path: PetAgent/Resources/Toys
        type: folder
        buildPhase: resources
    info:
      path: PetAgent/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Without this the compiled asset catalog is in the bundle but macOS
        # never looks for an icon in it -- both apps shipped iconless.
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Used to recognize voice commands via Push-to-Talk (PTT)."
        NSSpeechRecognitionUsageDescription: "Used to convert spoken commands into text."
        NSAppleEventsUsageDescription: "Needs to control other apps to run the run_applescript tool."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PetAgent/Resources/PetAgent.entitlements
    scheme:
      testTargets:
        - PetAgentTests
      commandLineArguments:
        "-PetAgentUITestMode": false

  # F13 (2026-07-30): the Claude-Desktop-style client window used to live
  # in-process inside PetAgent; it's now this separate, regular (Dock-
  # resident) app instead, so it gets a real Dock icon / Cmd+Tab / Spotlight
  # presence that an LSUIElement app can't have (byeolki: "별도의 앱으로
  # 해서 dock에 상시 표시"). It shares ClientWindow/Localization and the
  # wire-protocol subset of Bridge/ directly from PetAgent's sources rather
  # than through a separate framework target -- at this project's size a
  # real framework would mean marking ~17 files' worth of types/members
  # `public` for no real benefit, so both targets just compile the same
  # source files independently.
  PetAgentClient:
    type: application
    platform: macOS
    sources:
      - path: PetAgentClient
        excludes:
          - Resources/Info.plist
          - Resources/PetAgentClient.entitlements
      - path: PetAgent/ClientWindow
      - path: PetAgent/Localization
      - path: PetAgent/Resources/Assets.xcassets
      - path: PetAgent/Bridge/BridgeMessages.swift
      - path: PetAgent/Bridge/JSONValue.swift
      - path: PetAgent/Bridge/BridgeConnection.swift
      - path: PetAgent/Bridge/BridgeSocketPath.swift
      - path: PetAgent/Bridge/BridgeSocketClient.swift
      - path: PetAgent/Bridge/UserInputSender.swift
      - path: PetAgent/App/CompanionAppLauncher.swift
    info:
      path: PetAgentClient/Resources/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Same pumpkin, stamped "client": two Dock icons from the same mark
        # are otherwise impossible to tell apart (byeolki, 2026-07-30).
        CFBundleIconName: AppIconClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgentClient
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconClient
        CODE_SIGN_ENTITLEMENTS: PetAgentClient/Resources/PetAgentClient.entitlements

  PetAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PetAgentTests
      # Compiled straight into the test bundle rather than reached through
      # @testable import: it belongs to PetAgentClient, and adding it to the
      # PetAgent target instead would change the pet's binary (and with it
      # its ad-hoc signature, i.e. its Accessibility grant) for a file the
      # pet never uses.
      - path: PetAgentClient/ClientMainMenu.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgentTests
        # Xcode 26 refuses to code sign a test bundle with no Info.plist.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PetAgent
