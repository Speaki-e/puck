name: Shaydi
options:
  bundleIdPrefix: com.speaki-e
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  Shaydi:
    type: application
    platform: macOS
    sources:
      - path: Shaydi
        excludes:
          - Resources/Info.plist
          - Resources/Shaydi.entitlements
          - Resources/Avatars
          - Resources/Toys
      # Folder reference, not a group: the avatar package must keep its
      # Avatars/<name>/{manifest.json,*.usdz,sounds/} layout inside the app
      # bundle. As a group, Xcode flattens every file into Resources/ and
      # AvatarInstaller has nothing structured to copy out.
      - path: Shaydi/Resources/Avatars
        type: folder
        buildPhase: resources
      # Folder reference for the same reason as Avatars: each toy keeps its
      # own directory in the bundle, so ToyCatalogue can look artwork up by
      # toy name instead of relying on every file having a unique flat name.
      - path: Shaydi/Resources/Toys
        type: folder
        buildPhase: resources
    info:
      path: Shaydi/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Without this the compiled asset catalog is in the bundle but macOS
        # never looks for an icon in it -- both apps shipped iconless.
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Used to recognize voice commands via Push-to-Talk (PTT)."
        NSSpeechRecognitionUsageDescription: "Used to convert spoken commands into text."
        NSAppleEventsUsageDescription: "Needs to control other apps to run the run_applescript tool."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.Shaydi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Shaydi/Resources/Shaydi.entitlements
    scheme:
      testTargets:
        - ShaydiTests
      commandLineArguments:
        "-ShaydiUITestMode": false

  # F13 (2026-07-30): the Claude-Desktop-style client window used to live
  # in-process inside Shaydi; it's now this separate, regular (Dock-
  # resident) app instead, so it gets a real Dock icon / Cmd+Tab / Spotlight
  # presence that an LSUIElement app can't have (byeolki: "별도의 앱으로
  # 해서 dock에 상시 표시"). It shares ClientWindow/Localization and the
  # wire-protocol subset of Bridge/ directly from Shaydi's sources rather
  # than through a separate framework target -- at this project's size a
  # real framework would mean marking ~17 files' worth of types/members
  # `public` for no real benefit, so both targets just compile the same
  # source files independently.
  ShaydiAgent:
    type: application
    platform: macOS
    sources:
      - path: ShaydiAgent
        excludes:
          - Resources/Info.plist
          - Resources/ShaydiAgent.entitlements
      - path: Shaydi/ClientWindow
      - path: Shaydi/Localization
      # AgentSettingsView reuses SettingsSection/SettingsStackedRow rather
      # than hand-duplicating their padding/typography (2026-08-02, byeolki:
      # "패딩이나 폰트사이즈, 높이 같은게 아직 안 맞는 부분이 있는거 같은데").
      # Only this one file, not all of Shaydi/Settings -- the rest depends on
      # SettingsStore/AppAppearance/AvatarManagementView, which are Shaydi's.
      - path: Shaydi/Settings/SettingsComponents.swift
      # F15 (2026-07-31): the agent loop. Compiled into this app, not
      # Shaydi -- the pet executes tools, the client decides which ones.
      - path: Shaydi/Agent
      - path: Shaydi/Tools/ToolRegistry.swift
      - path: Shaydi/Tools/ToolTimeouts.swift
      - path: Shaydi/Resources/Assets.xcassets
      - path: Shaydi/Bridge/BridgeMessages.swift
      - path: Shaydi/Bridge/JSONValue.swift
      - path: Shaydi/Bridge/BridgeConnection.swift
      - path: Shaydi/Bridge/BridgeSocketPath.swift
      - path: Shaydi/Bridge/BridgeSocketClient.swift
      - path: Shaydi/Bridge/UserInputSender.swift
      - path: Shaydi/App/CompanionAppLauncher.swift
      - path: Shaydi/App/AppIdentity.swift
    info:
      path: ShaydiAgent/Resources/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Same pumpkin, stamped "client": two Dock icons from the same mark
        # are otherwise impossible to tell apart (byeolki, 2026-07-30).
        CFBundleIconName: AppIconClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.ShaydiAgent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconClient
        CODE_SIGN_ENTITLEMENTS: ShaydiAgent/Resources/ShaydiAgent.entitlements

  ShaydiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShaydiTests
      # Compiled straight into the test bundle rather than reached through
      # @testable import: it belongs to ShaydiAgent, and adding it to the
      # Shaydi target instead would change the pet's binary (and with it
      # its ad-hoc signature, i.e. its Accessibility grant) for a file the
      # pet never uses.
      - path: ShaydiAgent/ClientMainMenu.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.ShaydiTests
        # Xcode 26 refuses to code sign a test bundle with no Info.plist.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Shaydi
