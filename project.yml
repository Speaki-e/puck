name: PetAgent
options:
  bundleIdPrefix: com.speaki-e
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  PetAgent:
    type: application
    platform: macOS
    sources:
      - path: PetAgent
        excludes:
          - Resources/Info.plist
    info:
      path: PetAgent/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "Used to recognize voice commands via Push-to-Talk (PTT)."
        NSSpeechRecognitionUsageDescription: "Used to convert spoken commands into text."
        NSAppleEventsUsageDescription: "Needs to control other apps to run the run_applescript tool."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PetAgentTests
      commandLineArguments:
        "-PetAgentUITestMode": false

  PetAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PetAgentTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgentTests
    dependencies:
      - target: PetAgent
