name: PetAgent
options:
  bundleIdPrefix: com.speaki-e
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  PetAgent:
    type: application
    platform: macOS
    sources:
      - path: PetAgent
        excludes:
          - Resources/Info.plist
          - Resources/PetAgent.entitlements
          - Resources/Avatars
      # Folder reference, not a group: the avatar package must keep its
      # Avatars/<name>/{manifest.json,*.usdz,sounds/} layout inside the app
      # bundle. As a group, Xcode flattens every file into Resources/ and
      # AvatarInstaller has nothing structured to copy out.
      - path: PetAgent/Resources/Avatars
        type: folder
        buildPhase: resources
    info:
      path: PetAgent/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "Used to recognize voice commands via Push-to-Talk (PTT)."
        NSSpeechRecognitionUsageDescription: "Used to convert spoken commands into text."
        NSAppleEventsUsageDescription: "Needs to control other apps to run the run_applescript tool."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PetAgent/Resources/PetAgent.entitlements
    scheme:
      testTargets:
        - PetAgentTests
      commandLineArguments:
        "-PetAgentUITestMode": false

  PetAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PetAgentTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgentTests
        # Xcode 26 refuses to code sign a test bundle with no Info.plist.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PetAgent
