name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: architecture → typecheck → unit → build → e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure private protocol dependency access
        env:
          PROTOCOL_PAT: ${{ secrets.PROTOCOL_PAT }}
        run: |
          test -n "$PROTOCOL_PAT" || (echo "PROTOCOL_PAT secret is required" && exit 1)
          git config --global url."https://x-access-token:${PROTOCOL_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build renderer, main and agent host
        run: pnpm build

      - name: Install Electron runtime dependencies
        run: pnpm exec playwright install-deps

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron E2E tests
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
