name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate.sh

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project PetAgent.xcodeproj \
            -scheme PetAgent \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
