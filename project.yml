name: PetAgent
options:
  bundleIdPrefix: com.speaki-e
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  PetAgent:
    type: application
    platform: macOS
    sources:
      - path: PetAgent
        excludes:
          - Resources/Info.plist
    info:
      path: PetAgent/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "PTT(Push-to-Talk)로 음성 명령을 인식하기 위해 마이크를 사용합니다."
        NSSpeechRecognitionUsageDescription: "음성으로 말한 명령을 텍스트로 변환하기 위해 음성 인식을 사용합니다."
        NSAppleEventsUsageDescription: "run_applescript 도구 실행을 위해 다른 앱을 제어할 수 있어야 합니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PetAgentTests
      commandLineArguments:
        "-PetAgentUITestMode": false

  PetAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PetAgentTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speaki-e.PetAgentTests
    dependencies:
      - target: PetAgent
